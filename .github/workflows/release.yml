name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: harmonia.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: harmonia-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: harmonia-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: harmonia

      - name: Rename binary (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: mv harmonia/target/${{ matrix.target }}/release/harmonia-project ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv harmonia/target/${{ matrix.target }}/release/harmonia-project.exe harmonia.exe

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            harmonia-linux
            harmonia-mac
            harmonia.exe
