name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: monapp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: monapp
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: monapp

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/monapp ${{ matrix.artifact }}-${{ matrix.os }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/monapp.exe monapp-windows.exe

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            monapp-*
